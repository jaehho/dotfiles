# =============================================================================
# SHELL
# =============================================================================
set -g default-shell /usr/bin/fish

# =============================================================================
# PREFIX
# =============================================================================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# =============================================================================
# GENERAL
# =============================================================================
set -g mode-keys vi
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY"
set -ga terminal-overrides ",*:Tc"
set -s extended-keys always
set -as terminal-features 'xterm-kitty:extkeys'
set -as terminal-features '*:clipboard'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-hook -g session-created 'run-shell "n=1; for sid in $(tmux ls -F \"##{session_id}:##{session_name}\" | grep -E \":[0-9]+$\" | sort -t: -k2 -n | cut -d: -f1); do tmux rename-session -t \"\$sid\" \"\$n\"; n=\$((n+1)); done"'
set-hook -g session-closed 'run-shell "n=1; for sid in $(tmux ls -F \"##{session_id}:##{session_name}\" | grep -E \":[0-9]+$\" | sort -t: -k2 -n | cut -d: -f1); do tmux rename-session -t \"\$sid\" \"\$n\"; n=\$((n+1)); done"'
set -gq allow-passthrough on
set -g set-clipboard on
set -g visual-activity off

# =============================================================================
# KEY BINDINGS
# =============================================================================
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind T next-layout


# =============================================================================
# COPY MODE
# =============================================================================
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Yank the last command plus its output (completes tmux-yank's y = command line,
# Y = pwd). Relies on OSC 133 prompt marks, which fish emits by default (mark-prompt
# feature). Prompts are two lines, so the marks sit on the directory line: the first
# previous-prompt only reaches the live prompt above the cursor, the second reaches
# the one that ran the command, and cursor-down steps onto its "❯ " line. Starting
# there rather than at the output (previous-prompt -o) also picks up continuation
# lines of a multi-line command. next-prompt lands on the following prompt's first
# line, so back up one to end the selection. Pipe explicitly rather than leaning on
# set-clipboard: OSC 52 only lands when the pane is the client's visible one. Same
# routing as tmux-yank's bindings.
bind -N "Copy last command and its output" C-y \
  copy-mode \; \
  send -X previous-prompt \; \
  send -X previous-prompt \; \
  send -X cursor-down \; \
  send -X start-of-line \; \
  send -X begin-selection \; \
  send -X next-prompt \; \
  send -X cursor-up \; \
  send -X end-of-line \; \
  send -X copy-pipe-and-cancel '#{?@override_copy_command,#{@override_copy_command},wl-copy}'

# =============================================================================
# PLUGINS
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
# Clipboard routing: SSH → OSC 52 via tmux's set-clipboard (so the *local*
# terminal — kitty — receives the write, not the remote box). Local X11 →
# xclip. Local Wayland → tmux-yank auto-detects wl-copy.
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g @override_copy_command "tmux load-buffer -"'
if-shell '[ -z "$SSH_CONNECTION" ] && [ -z "$WAYLAND_DISPLAY" ]' \
  'set -g @override_copy_command "xclip -selection clipboard"'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 15min; never auto-restore (manual restore via prefix + C-r)
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# =============================================================================
# STATUS BAR (hand-rolled Solarized; @thm_* colors from generated tmux-colors.conf)
# =============================================================================
source-file -q ~/.config/theme/tmux-colors.conf

set -g status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"
set -g mode-style "bg=#{@thm_surface_0},bold"
set -wg pane-border-style "fg=#{@thm_overlay_0}"
set -wg pane-active-border-style "#{?pane_in_mode,fg=#{@thm_lavender},#{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[bg=#{@thm_yellow}#,fg=#{@thm_crust}] PREFIX #[default] ,}#{?window_zoomed_flag,#[bg=#{@thm_blue}#,fg=#{@thm_crust}] ZOOM #[default] ,}#{?#{==:#{pane_mode},copy-mode},#[bg=#{@thm_green}#,fg=#{@thm_crust}] COPY #[default] ,#{?#{==:#{pane_mode},tree-mode},#[bg=#{@thm_green}#,fg=#{@thm_crust}] PICK #[default] ,#{?#{==:#{pane_mode},buffer-mode},#[bg=#{@thm_green}#,fg=#{@thm_crust}] PASTE #[default] ,#{?#{==:#{pane_mode},clock-mode},#[bg=#{@thm_green}#,fg=#{@thm_crust}] CLOCK #[default] ,}}}}"

# Window tabs: rounded pill = index (accent) + name (surface). / = U+E0B6/E0B4.
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_crust},bg=#{@thm_overlay_2}]#[fg=#{@thm_mantle},reverse]#[none]#I #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{window_name}#[fg=#{@thm_mantle},reverse]#[none]"
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve}]#[fg=#{@thm_mantle},reverse]#[none]#I #[fg=#{@thm_fg},bg=#{@thm_surface_1}] #{window_name}#[fg=#{@thm_mantle},reverse]#[none]"

# Status-right: host (mauve 󰒋) + session (green, red on prefix, ).
set -g status-right "#[fg=#{@thm_mauve}]#[fg=#{@thm_crust},bg=#{@thm_mauve}]󰒋 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #H#[fg=#{@thm_surface_0}] #[fg=#{?client_prefix,#{@thm_red},#{@thm_green}}]#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_green}}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #S#[fg=#{@thm_surface_0}] "

# Prompt/message: style the format string (not message-style/-command-style) so
# one setting covers both prompt modes; fill= clears the status line behind it.
# ##{message} escapes -F's expansion.
set -gF message-format "#[fg=#{@thm_teal},bg=#{@thm_mantle},fill=#{@thm_mantle},align=left]##{message}"

# =============================================================================
# TPM (keep at bottom)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
