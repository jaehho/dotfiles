# Kokoro neural TTS via kokoro-tts-server (socket-activated user unit).
# The server streams raw PCM, so audio starts before the utterance is done.

# sd_generic cuts at any delimiter followed by a space -- by default ".", so
# "Fig. 3b" became two utterances with a stall between. The server chunks
# instead. An empty value falls back to ".", hence a character prose never has.
GenericMaxChunkLength 10000
GenericDelimiters "^"

# --properties names the stream, which mixers otherwise list as "pw-play: -".
GenericExecuteSynth \
"printf %s \'$DATA\' | curl -sf --unix-socket $XDG_RUNTIME_DIR/kokoro-tts.sock --data-binary @- \'http://kokoro/speak?voice=$VOICE&rate=$RATE\' | pw-play --raw --format s16 --rate 24000 --channels 1 --media-role Speech --properties \'{ node.name = kokoro-tts node.description = \"Text-to-speech (Kokoro)\" media.name = \"Text-to-speech (Kokoro)\" }\' -"

GenericCmdDependency "curl"
GenericCmdDependency "pw-play"
# $RATE is the raw speechd rate (-100..100); the server maps it to a multiplier.
GenericRateForceInteger 1

GenericLanguage "en" "en-US" "utf-8"

AddVoice "en-US" "FEMALE1" "af_heart"

DefaultVoice "af_heart"
