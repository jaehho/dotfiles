# Per-user speech-dispatcher config. It replaces /etc/speech-dispatcher/speechd.conf
# outright, so the stock settings are repeated here; only the modules, symbol
# preprocessing and audio output differ.
LogLevel  3
LogDir  "default"
DefaultVolume 100
# The default pulse output opens a playback stream as each module starts and
# holds it idle, and Firefox and Zotero keep the daemon running for good, so
# every mixer listed "speech-dispatcher-generic" and "-dummy" streams that never
# play. The PipeWire output creates its stream on the first utterance instead.
# Kokoro plays through its own pw-play either way.
AudioOutputMethod "pipewire"
# No SymbolsPreproc: with punctuation mode "none" it replaces %, &, °, quotes,
# brackets and the dots in "e.g." with spaces, so "50% at 37 °C" was read as
# "fifty at thirty-seven C". Kokoro's frontend reads symbols itself. (A screen
# reader that speaks punctuation would want these back.)
Include "clients/*.conf"

# Browsers (Gecko, so Zotero too) list only the default module's voices.
AddModule "kokoro"    "sd_generic"   "kokoro.conf"
AddModule "espeak-ng" "sd_espeak-ng" "espeak-ng.conf"
DefaultModule kokoro
DefaultLanguage "en-US"
