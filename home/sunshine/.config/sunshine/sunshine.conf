# Sunshine host for the Galaxy Tab second screen; see home/laptop/.local/bin/tablet-display.
# output_name is the headless Hyprland output that script creates (it reads the name from here).
# Capture through the compositor (wlr-screencopy), encode on the Intel iGPU. The adapter is named
# by PCI address because the renderD number can change.
#
# stream_audio: does Moonlight also play the PC's sound on the tablet? Off by
# default (the tablet is a display, not a second pair of speakers; with it on,
# Sunshine records the default sink's monitor and both play at once). The F1
# display menu and `tablet-display audio` flip it and restart Sunshine.
capture = wlr
encoder = vaapi
adapter_name = /dev/dri/by-path/pci-0000:00:02.0-render
output_name = tablet
stream_audio = disabled
