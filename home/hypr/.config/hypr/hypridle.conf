# Close to hypridle's shipped example. Idle sleep is otherwise ungated: an
# idle machine suspends, on AC too. The one gate is hypr-suspend-ok: a Claude
# session mid-turn (status busy) with the lid open defers suspend. Lid close is
# logind (HandleLidSwitch) and is unaffected. For any other long job, hold it
# awake with `systemd-inhibit --what=idle <cmd>`. See issue #25.
#
# Stay awake (hypr-idle-toggle) is such an inhibitor, for idle and the lid:
# every listener below pauses while it is held. hypridle itself keeps
# running, since lock_cmd here is the only thing that answers logind's Lock
# (Super+Escape, the bar's and the menu's Lock, before_sleep_cmd) and
# hypridle answers it whatever is inhibited. Stopping hypridle made every
# Lock do nothing.
#
# The idle dashboard (~/projects/dash) is manual-only now: Super+0 hops to an
# empty workspace over it, no hypridle listener.
#
# The sleep hooks also run wifi-sleep-probe (issue #68), which logs the Wi-Fi
# module's state around each suspend. `pre` runs before lock-session because
# hypridle holds the sleep lock until the lock is confirmed, so the probe
# finishes before the machine sleeps; `timeout` keeps a wedged device from
# delaying the lock. `post` is detached so it never delays hypr-wake-panel.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = timeout 3 wifi-sleep-probe pre; loginctl lock-session
    after_sleep_cmd = setsid -f wifi-sleep-probe post; hypr-wake-panel
}

listener {
    timeout = 300
    on-timeout = hypr-idle-dim
    on-resume = brightnessctl -r
}

# Lock after 10 minutes, except at home. `where` names the place from the
# Wi-Fi or wired connection (~/.config/where/places, set with
# `where mark home`); a network you have not named counts as away, so a new
# room locks. hypridle runs this through /bin/sh, hence the `!`. Like every
# listener here it pauses while stay awake is on, so a screen meant to stay
# on is never locked under you; lid close with stay awake on still locks
# (laptop-watchdog).
listener {
    timeout = 600
    condition_cmd = ! where --is home
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    condition_cmd = hypr-suspend-ok
    condition_retry = 60
    on-timeout = systemctl suspend
}
