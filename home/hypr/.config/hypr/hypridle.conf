# Close to hypridle's shipped example. Sleep is deliberately ungated: an idle
# machine always sleeps, on AC too, and hibernates after HibernateDelaySec
# (systemd/sleep.conf). Hold it awake for a long job
# with `systemd-inhibit --what=idle <cmd>`. See ISSUES.md 2026-09-12 (reset).
#
# The idle dashboard (~/projects/idle-dash) is manual-only now: Super+D toggles
# it, no hypridle listener.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hypr-wake-panel
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend-then-hibernate
}
