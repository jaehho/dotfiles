# Close to hypridle's shipped example. Idle sleep is otherwise ungated: an
# idle machine suspends, on AC too. The one gate is hypr-suspend-ok: a Claude
# session mid-turn (status busy) with the lid open defers suspend. Lid close is
# logind (HandleLidSwitch) and is unaffected. For any other long job, hold it
# awake with `systemd-inhibit --what=idle <cmd>`. See issue #25.
#
# The idle dashboard (~/projects/dash) is manual-only now: Super+D toggles
# it, no hypridle listener.
#
# The sleep hooks also run wifi-sleep-probe (issue #68), which logs the Wi-Fi
# module's state around each suspend. `pre` runs before lock-session because
# hypridle holds the sleep lock until the lock is confirmed, so the probe
# finishes before the machine sleeps; `timeout` keeps a wedged device from
# delaying the lock. `post` is detached so it never delays hypr-wake-panel.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = timeout 3 wifi-sleep-probe pre; loginctl lock-session
    after_sleep_cmd = setsid -f wifi-sleep-probe post; hypr-wake-panel
}

listener {
    timeout = 300
    on-timeout = hypr-idle-dim
    on-resume = brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    condition_cmd = hypr-suspend-ok
    condition_retry = 60
    on-timeout = systemctl suspend
}
