# Close to hypridle's shipped example. Idle sleep is otherwise ungated: an
# idle machine sleeps, on AC too, and hibernates after HibernateDelaySec
# (systemd/sleep.conf). The one gate is hypr-suspend-ok: a Claude session
# mid-turn (status busy) with the lid open defers suspend. Lid close is logind
# (HandleLidSwitch) and is unaffected. For any other long job, hold it
# awake with `systemd-inhibit --what=idle <cmd>`. See issue #25.
#
# The idle dashboard (~/projects/dash) is manual-only now: Super+D toggles
# it, no hypridle listener.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hypr-wake-panel
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    condition_cmd = hypr-suspend-ok
    condition_retry = 60
    on-timeout = systemctl suspend-then-hibernate
}
