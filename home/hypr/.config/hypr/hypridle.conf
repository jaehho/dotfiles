general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Dim screen after 5 minutes
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock screen after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn off display after 15 minutes
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Sleep after 30 min idle, but only on battery.
#
# Without this there is NO idle->sleep path at all: logind IdleAction=ignore,
# and the lid switch has already fired by the time the machine is asleep. A
# machine woken with nobody at the keyboard (lid opened at 01:17 on
# 2026-08-18) sat awake at ~13 W and drained 79% -> 2% in under four hours.
# dpms-off alone does not save you.
#
# The old "no auto-hibernate, every hibernate is a GSP coin flip" rule was
# about nvidia-open 595. We run proprietary nvidia with NVreg_EnableGpuFirmware=0
# (no GSP) and NVreg_PreserveVideoMemoryAllocations=1; hibernate is clean.
# See ISSUES.md 2026-08-18.
# Heartbeat. Purely diagnostic: it makes the idle clock observable in the
# journal, so after an incident you can tell "hypridle never counted up"
# (something holds a Wayland idle inhibitor) apart from "it counted up and the
# sleep gate declined". Without this the failure is silent either way.
listener {
    timeout = 120
    on-timeout = logger -t hypr-idle "idle 120s"
    on-resume = logger -t hypr-idle "active again"
}

# Sleep on battery. The gate lives in the script -- an inline
# `grep -qx 1 /sys/class/power_supply/*/online` also matches the ucsi USB-C
# nodes, which can latch online=1 on a docked machine that is genuinely
# discharging, silently suppressing sleep. See ISSUES.md 2026-08-27.
listener {
    timeout = 1800
    on-timeout = ~/.local/bin/hypr-sleep-if-idle
}
