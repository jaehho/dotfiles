# Night light schedule. hyprsunset is started in hyprland.lua and switches
# at these clock times (instantly, no fade). Clock times rather than sunset:
# the light that matters is in the hours before bed, while New York sunset
# swings from 16:28 to 20:31 over the year. Keep 21:00 about two to three
# hours before bedtime.
#
# 4000K is moderate on purpose: a warmer CTM squeezes the blue-yellow
# differences that red-green-weak vision leans on. Super+N (and the settings
# menu tile) override the current profile until the next switch.

profile {
    time = 7:00
    identity = true
}

profile {
    time = 21:00
    temperature = 4000
}
