# hyprpaper - replaces hypr-wallpaper (retired 2026-09-01).
#
# Note this file is hyprlang, not Lua: hyprpaper is a separate program and did
# not follow Hyprland's config change.
#
# IMPORTANT: hyprpaper 0.8 has no `reload` IPC verb (`hyprctl hyprpaper reload`
# answers "invalid hyprpaper request"). Editing this file changes nothing until
# the process is restarted.

splash = 0
ipc = 1

# Deliberately NOT a directory with order = random.
#
# Pointing hyprpaper at the wallpaper folder means it re-rolls a random image
# from the whole collection on every start -- each session restart, each
# hyprpaper restart -- which reads as "my wallpaper keeps changing on its own".
# Adding `timeout` on top of that rotated the folder every 30 minutes.
#
# Instead this is a single stable path: the .current symlink, repointed by
# wallhelper when it lands the day's photo. One photo, chosen once a day,
# and it stays until tomorrow. kept/ is an archive you keep, not a pool to
# shuffle -- nothing displays from it unless you ask for it.
wallpaper {
    monitor =
    path = ~/Media/wallpapers/.current
    fit_mode = cover
}
