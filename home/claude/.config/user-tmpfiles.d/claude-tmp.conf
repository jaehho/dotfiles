# Claude Code keeps its scratch in /tmp/claude-<uid>. /tmp is a RAM
# tmpfs with a per-user quota of 80%, and what does not fit in RAM sits
# in swap. The stock rule ages /tmp at 10 days, which is too slow here:
# ten days of sessions can fill the quota (EDQUOT) and hold that much
# swap. Remove files below it untouched (atime, mtime, ctime) for 7
# days; the folder itself stays. Read by the user's daily
# systemd-tmpfiles-clean.timer (upstream preset: enabled; Arch does
# not apply presets, so enable it once by hand).
e /tmp/claude-%U - - - 7d
