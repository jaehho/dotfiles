# Read CLAUDE.md in repos that have no AGENTS.md (dotfiles, ~/projects/*).
project_doc_fallback_filenames = ["CLAUDE.md"]
approvals_reviewer = "user"

[mcp_servers.zotero]
command = "uvx"
args = ["--from", "zotero-mcp-server[all]", "zotero-mcp"]
# zotero-mcp reads its keys and the WebDAV login (a web-API attach needs
# it, jaehho/zotero#18) from client_env in ~/.config/zotero-mcp/config.json
# (mode 600), not from the session environment.

[projects."/home/jaeho/dotfiles"]
trust_level = "trusted"

[projects."/home/jaeho/projects/wombat"]
trust_level = "trusted"

[tui]
whimsy = false

[tui.model_availability_nux]
gpt-6-astra = 4
