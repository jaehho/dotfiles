# =============================================================================
# SHELL
# =============================================================================
set -g default-shell /usr/bin/fish

# =============================================================================
# PREFIX
# =============================================================================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# =============================================================================
# GENERAL
# =============================================================================
set -g mode-keys vi
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY"
set -ga terminal-overrides ",*:Tc"
# `on`, not `always`: with `always`, replies to terminal queries (snacks.image's
# XTVERSION probe) reach nvim as keystrokes. See issue #35.
set -s extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'
# Without this tmux drops OSC 8, so kitty never sees app hyperlinks (ctrl+click on
# them, ctrl+shift+e, ctrl+shift+p y). Claude Code emits OSC 8 under tmux >= 3.4.
set -as terminal-features 'xterm-kitty:hyperlinks'
set -as terminal-features '*:clipboard'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-hook -g session-created 'run-shell "n=1; for sid in $(tmux ls -F \"##{session_id}:##{session_name}\" | grep -E \":[0-9]+$\" | sort -t: -k2 -n | cut -d: -f1); do tmux rename-session -t \"\$sid\" \"\$n\"; n=\$((n+1)); done"'
set-hook -g session-closed 'run-shell "n=1; for sid in $(tmux ls -F \"##{session_id}:##{session_name}\" | grep -E \":[0-9]+$\" | sort -t: -k2 -n | cut -d: -f1); do tmux rename-session -t \"\$sid\" \"\$n\"; n=\$((n+1)); done"'
set -gq allow-passthrough on
set -g set-clipboard on
set -g visual-activity off

# Forward a title to the outer terminal. Off by default,
# which leaves kitty naming tmux windows after the shell,
# so waybar's window title reads "fish". Windows are
# auto-renamed to the running command: "#S:#W" -> "2:nvim".
set -g set-titles on
set -g set-titles-string "#S:#W"

# =============================================================================
# KEY BINDINGS
# =============================================================================
bind -N "Reload this config" r source-file ~/.tmux.conf \; display "Config reloaded!"

unbind '"'
unbind %
bind -N "New window here" c new-window -c "#{pane_current_path}"
bind -N "Split right" | split-window -h -c "#{pane_current_path}"
bind -N "Split down" - split-window -v -c "#{pane_current_path}"

bind -rN "Resize pane left" h resize-pane -L 5
bind -rN "Resize pane down" j resize-pane -D 5
bind -rN "Resize pane up" k resize-pane -U 5
bind -rN "Resize pane right" l resize-pane -R 5

bind -N "Next layout" T next-layout


# =============================================================================
# COPY MODE
# =============================================================================
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Yank the last command plus its output (completes tmux-yank's y = command line,
# Y = pwd). Relies on OSC 133 prompt marks. fish 4.9's own marks die to its
# erase-display before the prompt (tmux ≤ 3.7c clears line flags, tmux#3856), so
# fish_prompt re-emits a surviving mark on the blank separator line above each
# prompt (conf.d/theme.fish). The first previous-prompt only reaches the live
# prompt's separator, the second reaches the one that ran the command, and two
# cursor-downs step onto its "❯ " line. Starting there rather than at the output
# (previous-prompt -o) also picks up continuation lines of a multi-line command.
# next-prompt lands on the following prompt's separator, so back up one to end
# the selection. Pipe explicitly rather than leaning on set-clipboard: OSC 52
# only lands when the pane is the client's visible one. Same routing as
# tmux-yank's bindings.
bind -N "Copy last command and its output" C-y \
  copy-mode \; \
  send -X previous-prompt \; \
  send -X previous-prompt \; \
  send -X cursor-down \; \
  send -X cursor-down \; \
  send -X start-of-line \; \
  send -X begin-selection \; \
  send -X next-prompt \; \
  send -X cursor-up \; \
  send -X end-of-line \; \
  send -X copy-pipe-and-cancel '#{?@override_copy_command,#{@override_copy_command},wl-copy}'

# =============================================================================
# PLUGINS
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
# Clipboard routing: SSH → OSC 52 via tmux's set-clipboard (so the *local*
# terminal — kitty — receives the write, not the remote box). Local X11 →
# xclip. Local Wayland → tmux-yank auto-detects wl-copy.
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g @override_copy_command "tmux load-buffer -"'
if-shell '[ -z "$SSH_CONNECTION" ] && [ -z "$WAYLAND_DISPLAY" ]' \
  'set -g @override_copy_command "xclip -selection clipboard"'
# v3 split the multiplexer out of smart-splits.nvim. This is the tmux half:
# it binds C-hjkl/M-hjkl on @pane-is-vim, which the nvim backend keeps set.
set -g @plugin 'smart-splits-nvim/backend-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 15min; never auto-restore (manual restore via prefix + C-r)
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# =============================================================================
# STATUS BAR (hand-rolled pills; Everforest Dark Medium tokens)
# =============================================================================

# Everforest Dark Medium (sainnhe/everforest palette.md), a hand recolor of
# the catppuccin/tmux Mocha tokens these formats used. That plugin is no
# longer run: it only loads its four flavors, and overriding its @thm_*
# tokens would keep Catppuccin names on Everforest colors.
set -g @ef_bg_dim "#232a2e"
set -g @ef_bg0 "#2d353b"
set -g @ef_bg1 "#343f44"
set -g @ef_bg2 "#3d484d"
set -g @ef_bg3 "#475258"
set -g @ef_fg "#d3c6aa"
set -g @ef_red "#e67e80"
set -g @ef_orange "#e69875"
set -g @ef_yellow "#dbbc7f"
set -g @ef_green "#a7c080"
set -g @ef_aqua "#83c092"
set -g @ef_blue "#7fbbb3"
set -g @ef_purple "#d699b6"
set -g @ef_grey0 "#7a8478"
set -g @ef_grey2 "#9da9a0"

# Token map (no hexes below):
#   status bg, chip fg  @ef_bg_dim
#   text                @ef_fg
#   resting pill        @ef_bg1          current pill @ef_bg2
#   index inactive      @ef_grey2        current/host @ef_purple
#   PREFIX (glance)     @ef_orange       ZOOM @ef_blue
#   COPY/PICK/PASTE     @ef_green        critical @ef_red
#   active border       @ef_green        synced @ef_purple

# Defaults the catppuccin plugin used to set, recolored. -F expands the
# tokens once, as the plugin did.
set -gF message-style "fg=#{@ef_aqua},bg=#{@ef_bg2},fill=#{@ef_bg2}"
set -gF message-command-style "fg=#{@ef_aqua},bg=#{@ef_bg2},fill=#{@ef_bg2}"
set -gF menu-selected-style "fg=#{@ef_fg},bold,bg=#{@ef_bg3}"
set -gF popup-style "bg=#{@ef_bg0},fg=#{@ef_fg}"
set -gF popup-border-style "fg=#{@ef_bg2}"
set -gF window-status-activity-style "bg=#{@ef_green},fg=#{@ef_bg_dim}"
set -gF window-status-bell-style "bg=#{@ef_yellow},fg=#{@ef_bg_dim}"
set -gF clock-mode-colour "#{@ef_blue}"

set -g status-style "bg=#{@ef_bg_dim},fg=#{@ef_fg}"
set -g mode-style "bg=#{@ef_bg1},bold"
set -wg pane-border-style "fg=#{@ef_grey0}"
set -wg pane-active-border-style "#{?pane_in_mode,fg=#{@ef_orange},#{?pane_synchronized,fg=#{@ef_purple},fg=#{@ef_green}}}"

set -g status-right-length 100
set -g status-left-length 100
# Chips use #[bg=…]#[fg=…], not one #[bg=…,fg=…]: inside #{?cond,true,false}
# a comma in a style is the ternary separator, so the true branch truncates at
# the style comma and the chip never renders (PREFIX was just a bare bg).
set -g status-left "#{?client_prefix,#[bg=#{@ef_orange}]#[fg=#{@ef_bg_dim}] PREFIX #[default] ,}#{?window_zoomed_flag,#[bg=#{@ef_blue}]#[fg=#{@ef_bg_dim}] ZOOM #[default] ,}#{?#{==:#{pane_mode},copy-mode},#[bg=#{@ef_green}]#[fg=#{@ef_bg_dim}] COPY #[default] ,#{?#{==:#{pane_mode},tree-mode},#[bg=#{@ef_green}]#[fg=#{@ef_bg_dim}] PICK #[default] ,#{?#{==:#{pane_mode},buffer-mode},#[bg=#{@ef_green}]#[fg=#{@ef_bg_dim}] PASTE #[default] ,#{?#{==:#{pane_mode},clock-mode},#[bg=#{@ef_green}]#[fg=#{@ef_bg_dim}] CLOCK #[default] ,}}}}"

# Window tabs: rounded pill = index (accent) + name (surface). / = U+E0B6/E0B4.
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@ef_bg_dim},bg=#{@ef_grey2}]#[fg=#{@ef_bg_dim},reverse]#[none]#I #[fg=#{@ef_fg},bg=#{@ef_bg1}] #{window_name}#[fg=#{@ef_bg_dim},reverse]#[none]"
set -g window-status-current-format "#[fg=#{@ef_bg_dim},bg=#{@ef_purple}]#[fg=#{@ef_bg_dim},reverse]#[none]#I #[fg=#{@ef_fg},bg=#{@ef_bg2}] #{window_name}#[fg=#{@ef_bg_dim},reverse]#[none]"

# Status-right: host (purple) + session (green, red on prefix).
set -g status-right "#[fg=#{@ef_purple}]#[fg=#{@ef_bg_dim},bg=#{@ef_purple}]󰒋 #[fg=#{@ef_fg},bg=#{@ef_bg1}] #H#[fg=#{@ef_bg1}] #[fg=#{?client_prefix,#{@ef_red},#{@ef_green}}]#[fg=#{@ef_bg_dim},bg=#{?client_prefix,#{@ef_red},#{@ef_green}}] #[fg=#{@ef_fg},bg=#{@ef_bg1}] #S#[fg=#{@ef_bg1}] "

# Prompt/message: style the format string (not message-style/-command-style) so
# one setting covers both prompt modes; fill= clears the status line behind it.
# ##{message} escapes -F's expansion.
set -gqF message-format "#[fg=#{@ef_aqua},bg=#{@ef_bg_dim},fill=#{@ef_bg_dim},align=left]##{message}"

# =============================================================================
# TPM (keep at bottom)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
