# Sourced by makepkg after /etc/makepkg.conf and /etc/makepkg.conf.d/.
#
# Arch's OPTIONS turn on `debug`, so every AUR build also wrote a -debug
# package (swaync-debug and the like) that nothing here reads. makepkg
# takes an option's last mention in OPTIONS, so this later !debug wins
# over the stock `debug` and the rest of the stock line stays as is.
OPTIONS+=(!debug)
