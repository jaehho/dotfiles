# Bare GitHub issue refs from detect_url_regex. ${URL} is the matched text.
# Absolute path: launch --type=background does not see ~/.local/bin.
url ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+$ action launch --type=background /home/jaeho/.local/bin/open-github-ref ${URL}
url ^#[0-9]+$ action launch --type=background /home/jaeho/.local/bin/open-github-ref ${URL}
