# theme/authorColors: Everforest Dark Medium, a hand recolor of the
# Catppuccin Mocha (lavender) port with sainnhe/everforest palette.md.
theme:
  activeBorderColor:
    - '#a7c080'
    - bold
  inactiveBorderColor:
    - '#9da9a0'
  searchingActiveBorderColor:
    - '#dbbc7f'
  optionsTextColor:
    - '#7fbbb3'
  selectedLineBgColor:
    - '#343f44'
  inactiveViewSelectedLineBgColor:
    - '#475258'
  cherryPickedCommitFgColor:
    - '#a7c080'
  cherryPickedCommitBgColor:
    - '#3d484d'
  markedBaseCommitFgColor:
    - '#7fbbb3'
  markedBaseCommitBgColor:
    - '#dbbc7f'
  unstagedChangesColor:
    - '#e67e80'
  defaultFgColor:
    - '#d3c6aa'

authorColors:
  '*': '#a7c080'

# Cycle with | . Delta matches terminal git (core.pager) and the
# solid-word / quiet-line idea in nvim diff_hl.lua. Difftastic is
# on-demand structural review (same as `git difft`).
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never
      name: delta
    - type: extDiff
      command: difft --color=always --background={{colorScheme}} --context={{diffContext}}
      name: difftastic
    - type: rawGit
      args: [--color-words]
      name: color-words
    - type: rawGit
      name: default
