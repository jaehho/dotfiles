theme:
  activeBorderColor:
    - '#b4befe'
    - bold
  inactiveBorderColor:
    - '#a6adc8'
  searchingActiveBorderColor:
    - '#f9e2af'
  optionsTextColor:
    - '#89b4fa'
  selectedLineBgColor:
    - '#313244'
  inactiveViewSelectedLineBgColor:
    - '#6c7086'
  cherryPickedCommitFgColor:
    - '#b4befe'
  cherryPickedCommitBgColor:
    - '#45475a'
  markedBaseCommitFgColor:
    - '#89b4fa'
  markedBaseCommitBgColor:
    - '#f9e2af'
  unstagedChangesColor:
    - '#f38ba8'
  defaultFgColor:
    - '#cdd6f4'

authorColors:
  '*': '#b4befe'

# Cycle with | . Delta matches terminal git (core.pager) and the
# solid-word / quiet-line idea in nvim diff_hl.lua. Difftastic is
# on-demand structural review (same as `git difft`).
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never
      name: delta
    - type: extDiff
      command: difft --color=always --background={{colorScheme}} --context={{diffContext}}
      name: difftastic
    - type: rawGit
      args: [--color-words]
      name: color-words
    - type: rawGit
      name: default
