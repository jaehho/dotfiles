# Everforest Dark Medium: a hand recolor of the Catppuccin Mocha (lavender)
# port (catppuccin/mpv) with sainnhe/everforest palette.md.

# Main mpv options
background-color='#2d353b'
osd-back-color='#232a2e'
osd-border-color='#232a2e'
osd-color='#d3c6aa'
osd-shadow-color='#2d353b'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-border_color=2e2a23
script-opts-append=stats-font_color=aac6d3
script-opts-append=stats-plot_bg_border_color=80c0a7
script-opts-append=stats-plot_bg_color=2e2a23
script-opts-append=stats-plot_color=80c0a7

# External script options
# It is fine to leave these here even if one does not use these scripts because they are just ignored unless a script uses them

# UOSC options
script-opts-append=uosc-color=foreground=a7c080,foreground_text=343f44,background=2d353b,background_text=d3c6aa,curtain=232a2e,success=a7c080,error=e67e80
