# Everforest Dark Medium: a hand recolor of the Catppuccin Mocha port
# (catppuccin/starship) with sainnhe/everforest palette.md.
palette = "everforest_dark_medium"

# Two lines: context line, then the prompt character. Any module not
# listed here (package, python, gcloud, nodejs, ...) never renders.
# The blank separator line comes from fish_prompt in conf.d/theme.fish,
# which rides it with an OSC 133;A mark for tmux copy-mode; keep that
# pair together.
add_newline = false
format = '$directory$git_branch$git_status$cmd_duration$line_break$character'

[palettes.everforest_dark_medium]
bg_dim = "#232a2e"
bg0 = "#2d353b"
bg1 = "#343f44"
bg2 = "#3d484d"
bg3 = "#475258"
bg4 = "#4f585e"
bg5 = "#56635f"
bg_visual = "#543a48"
bg_red = "#514045"
bg_yellow = "#4d4c43"
bg_green = "#425047"
bg_blue = "#3a515d"
bg_purple = "#4a444e"
fg = "#d3c6aa"
red = "#e67e80"
orange = "#e69875"
yellow = "#dbbc7f"
green = "#a7c080"
aqua = "#83c092"
blue = "#7fbbb3"
purple = "#d699b6"
grey0 = "#7a8478"
grey1 = "#859289"
grey2 = "#9da9a0"

# blue = you are here.
[directory]
style = 'bold blue'
truncation_length = 3

# Branch is resting context; status symbols are worth a glance (orange).
[git_branch]
format = 'on [$branch]($style) '
style = 'grey0'

[git_status]
style = 'orange'

[cmd_duration]
format = '[$duration]($style) '
style = 'grey0'
