# s2idle -> hibernate handoff for suspend-then-hibernate, on AC too.
# Leave HibernateOnACPower at its default (yes): with =no, a timer wake on AC
# re-suspends, and nvidia's system-sleep hook never re-primes procfs for that,
# so PreserveVideoMemoryAllocations=1 makes it fail with -5 and the machine
# stays awake. See issue #25.
[Sleep]
HibernateDelaySec=1h
