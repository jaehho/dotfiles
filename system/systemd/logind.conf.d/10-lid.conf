# Lid close sleeps. Rollback to lock if suspend regressions surface
# (proprietary nvidia required; nvidia-open breaks all sleep-resume).
#
# On battery: suspend-then-hibernate. s2idle is the only sleep state this
# Lunar Lake box advertises (`cat /sys/power/mem_sleep` -> [s2idle]), and it
# is not cheap enough to hold overnight, so hand off to hibernate after
# HibernateDelaySec (see ../sleep.conf).
# On AC: plain suspend -- no reason to pay the hibernate round trip.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend

# Honor idle inhibitors for lid close (mpv/browser video, hypridle locks)
LidSwitchIgnoreInhibited=no
