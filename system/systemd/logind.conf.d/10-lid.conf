# Lid close sleeps. Rollback to lock if suspend regressions surface
# (proprietary nvidia required; nvidia-open breaks all sleep-resume).
#
# Plain suspend on battery and AC. s2idle is the only sleep state this Lunar
# Lake box advertises (`cat /sys/power/mem_sleep` -> [s2idle]), about 0.6 W.
# suspend-then-hibernate was dropped (issue #29): its hibernate leg hung at
# `hibernation entry` three times. Hibernate remains only as UPower's
# critical-battery action (../../upower).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend

# Honor idle inhibitors for lid close (mpv/browser video, hypridle locks)
LidSwitchIgnoreInhibited=no
