# reflector.timer is Persistent=true, so a missed weekly run fires the instant
# the laptop resumes, before Wi-Fi is back, and fails on DNS. Retry instead of
# sitting failed for a week. Between tries the unit is activating, not failed.
[Unit]
StartLimitIntervalSec=1h
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2min
