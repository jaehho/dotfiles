# linux-modules-cleanup (from kernel-modules-hook) moves module trees for
# uninstalled kernels into /usr/lib/modules/.old rather than deleting them —
# and nothing on the system ever prunes that directory. Left alone it grows by
# ~575 MB per kernel forever; on this machine 7 dead kernels had accumulated
# 4.0 GB before the service was even enabled.
#
# Nothing reads .old. GRUB has no boot entries for uninstalled kernels, and the
# running kernel's modules are protected by a separate mechanism — the
# 10-linux-modules-{pre,post} pacman hooks, which stash and restore them around
# a transaction so module loading survives an upgrade before you reboot.
#
# So drop the archive once the service has made its pass. To keep it instead,
# remove this drop-in and re-run `make sync`.
[Service]
ExecStartPost=/bin/rm -rf /usr/lib/modules/.old
