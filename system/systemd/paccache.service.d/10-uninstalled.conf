# pacman-contrib's paccache.service runs `paccache -r`, which prunes superseded
# versions of *installed* packages but leaves the full cache of packages that
# were removed entirely. On this machine that second category was 2.15 GiB.
#
# Type=oneshot permits multiple ExecStart lines, and drop-ins append rather than
# replace, so this adds a second pass without forking the unit.
[Service]
ExecStart=/usr/bin/paccache -ruk0
