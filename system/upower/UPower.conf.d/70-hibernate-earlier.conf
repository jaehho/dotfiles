# The one set of battery thresholds. UPower hibernates at PercentageAction, and
# battery-logd's notifications show the same levels, so they cannot disagree.
# Stock action is 2%, about 8 min at ~10 W: too late to be a safety net.
# Values must be strictly descending (Low > Critical > Action) or UPower
# silently falls back to its defaults.
[UPower]
PercentageLow=20.0
PercentageCritical=15.0
PercentageAction=10.0
CriticalPowerAction=Hibernate
