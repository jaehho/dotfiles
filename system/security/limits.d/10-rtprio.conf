# Hyprland raises its main thread to SCHED_RR at sched_get_priority_min(SCHED_RR)
# == 1 for frame pacing. The default rtprio limit is 0, so the call fails and it
# prints "Failed to change process scheduling strategy" to tty1 at every login,
# then runs with normal scheduling.
#
# Grant exactly what it asks for and nothing more: priority 1 is the lowest real-
# time band, so a wedged RT task still loses to anything above it. Note this box
# has RT throttling off (kernel.sched_rt_runtime_us == sched_rt_period_us), which
# is why the limit is 1 and not the usual 95/98.
#
# Applied by pam_limits via /etc/pam.d/login; takes effect at the next tty login.
@wheel  -  rtprio  1
