# reflector — keeps /etc/pacman.d/mirrorlist ranked by measured download speed.
#
# Before this, the mirrorlist had all 427 mirrors uncommented and pacman simply
# walked them in file order. That worked because the first few happen to be
# CDNs, but nothing was actually measuring anything.
#
# Run weekly by reflector.timer. Edit here and re-run `make sync` to change.

# Overwrite the live mirrorlist in place.
--save /etc/pacman.d/mirrorlist

--protocol https

# Narrow to nearby mirrors before rate-testing — testing every mirror on earth
# would take far longer than it is worth. Change this if you relocate.
--country US

# Ignore anything that has not synced in the last 12 hours, so a stale mirror
# can never serve old packages.
--age 12

# Of what survives, take the 20 most recently synced, actually measure download
# speed against each, and keep the 10 fastest in that order.
--latest 20
--sort rate
--number 10
